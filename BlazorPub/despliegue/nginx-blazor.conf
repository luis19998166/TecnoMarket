include /etc/nginx/conf.d/upstream.conf;   # upstream blazor { server 127.0.0.1:8081; }

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 443 ssl http2;
    server_name app.ejemplo.bo;
    ssl_certificate     /etc/letsencrypt/live/app.ejemplo.bo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.ejemplo.bo/privkey.pem;

    location / {
        proxy_pass http://blazor;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;          # WebSockets de SignalR (Blazor Server)
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 100s;
    }
}
