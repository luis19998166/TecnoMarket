# Publicacion blue-green en Azure App Service (Windows) con slot de "staging" y auto swap.
# 1) compila y publica  2) despliega en staging (entorno inactivo)
# 3) Azure calienta staging, exige /healthz = 200 y recien entonces hace el swap a produccion
# 4) el workflow verifica que produccion ya sirve la version nueva.
# Si staging no responde sano, Azure cancela el swap y produccion no se toca.
name: azure-blue-green

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}   # p. ej. tecnomarket-upds
  VERSION: 1.0.${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '9.0.x' }
      - run: dotnet build BlazorPub/BlazorPub.sln -c Release
      - run: dotnet publish BlazorPub/BlazorPub/BlazorPub.csproj -c Release -o publicado -p:InformationalVersion=${{ env.VERSION }}
      - uses: actions/upload-artifact@v4
        with: { name: app, path: publicado }

  deploy:
    needs: build
    if: ${{ vars.AZURE_WEBAPP_NAME != '' }}   # no intenta desplegar hasta que configures Azure
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - uses: actions/download-artifact@v4
        with: { name: app, path: publicado }

      - name: Desplegar en el slot de staging (entorno inactivo)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          slot-name: staging
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_STAGING }}
          package: publicado

      - name: Esperar el swap y verificar produccion
        run: |
          URL="https://${APP_NAME}.azurewebsites.net"
          for i in $(seq 1 40); do
            V=$(curl -s "$URL/api/version" || true)
            echo "Produccion responde: $V"
            if echo "$V" | grep -q "\"$VERSION\""; then
              curl -fs "$URL/healthz" && curl -fs "$URL/api/tienda/productos" | grep -q '"nombre"' && echo "OK: produccion en $VERSION" && exit 0
            fi
            sleep 15
          done
          echo "Produccion no cambio a $VERSION en 10 min: revisa el auto swap y el registro de actividad del slot"
          exit 1

# Reversion: Portal > App Service > Ranuras de implementacion > Intercambiar
# (la version anterior quedo en el slot de staging).
