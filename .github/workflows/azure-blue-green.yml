# Publicacion blue-green en Azure App Service usando un slot de "staging".
# 1) compila y prueba  2) despliega en staging  3) health check + prueba de humo
# 4) swap staging <-> produccion (sin tiempo de inactividad). Si algo falla, produccion no se toca.
name: azure-blue-green

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}          # p. ej. tecnomarket-upds
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }} # p. ej. rg-tecnomarket
  SLOT: staging

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '9.0.x' }
      - run: dotnet build BlazorPub/BlazorPub.sln -c Release
      - run: dotnet test BlazorPub/BlazorPub.sln -c Release --no-build
      - run: dotnet publish BlazorPub/BlazorPub/BlazorPub.csproj -c Release -o publicado -p:InformationalVersion=1.0.${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with: { name: app, path: publicado }

  deploy:
    needs: build
    if: ${{ vars.AZURE_WEBAPP_NAME != '' }}   # no intenta desplegar hasta que configures Azure
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - uses: actions/download-artifact@v4
        with: { name: app, path: publicado }

      - name: Iniciar sesion en Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Desplegar en el slot de staging (entorno inactivo)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          slot-name: ${{ env.SLOT }}
          package: publicado

      - name: Health check y prueba de humo sobre staging
        run: |
          URL="https://${APP_NAME}-${SLOT}.azurewebsites.net"
          for i in $(seq 1 30); do curl -fs "$URL/healthz" && break; sleep 10; done
          curl -fs "$URL/healthz"
          curl -fs "$URL/api/tienda/productos" | grep -q '"nombre"'
          curl -fs "$URL/" | grep -q 'TecnoMarket'
          echo "Staging verificado: $(curl -s $URL/api/version)"

      - name: Swap staging -> produccion
        run: az webapp deployment slot swap -g "$RESOURCE_GROUP" -n "$APP_NAME" --slot "$SLOT" --target-slot production

      - name: Verificar produccion
        run: curl -fs "https://${APP_NAME}.azurewebsites.net/api/version"

# Reversion: volver a ejecutar el swap (la version anterior quedo en staging):
#   az webapp deployment slot swap -g <grupo> -n <app> --slot staging --target-slot production
