name: ci-cd-blue-green
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '9.0.x' }
      - run: dotnet build BlazorPub/BlazorPub.sln -c Release
      - run: dotnet test BlazorPub/BlazorPub.sln -c Release --no-build
      - name: Construir y publicar imagen
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build -t ghcr.io/${{ github.repository }}:${{ github.sha }} BlazorPub
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - name: Desplegar en el slot inactivo y conmutar
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: ./despliegue/blue-green.sh ghcr.io/${{ github.repository }}:${{ github.sha }}
